<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>護理作業規範互動導覽系統 (圖形融合版)</title>

    <!-- LINE 環境自動跳轉腳本 -->
    <script>
        (function () {
            const isLine = navigator.userAgent.includes("Line") || navigator.userAgent.includes("LINE");
            const hasParam = window.location.search.includes("openExternalBrowser=1");
            if (isLine && !hasParam) {
                const newUrl = window.location.href + (window.location.href.includes('?') ? '&' : '?') + "openExternalBrowser=1";
                window.location.replace(newUrl);
            }
        })();
    </script>

    <style>
        :root {
            --app-max-width: 1100px;
            --base-font-size: 16px;
            --menu-font-size: 14px;
            --title-font-size: 16px;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            margin: 0;
            padding: 2vw;
            background-color: #f4f6f9;
            font-size: var(--base-font-size);
        }

        * {
            box-sizing: border-box;
        }

        .app-container {
            max-width: var(--app-max-width);
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0 0 10px 0;
            font-size: clamp(20px, 3vw, 24px);
        }

        .header p {
            margin: 0;
            color: #bdc3c7;
            font-size: clamp(13px, 1.5vw, 15px);
        }

        .tabs {
            display: flex;
            background-color: #34495e;
            flex-wrap: nowrap;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 10px;
            border: none;
            background: none;
            color: white;
            font-size: clamp(14px, 2vw, 16px);
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: #2c3e50;
        }

        .tab-btn.active {
            background-color: #3498db;
            font-weight: bold;
        }

        .content-area {
            position: relative;
            height: 700px;
            padding: 20px;
            display: none;
            background-color: #ecf0f1;
        }

        .content-area.active {
            display: block;
        }

        .visual-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            /* 讓內部的比例容器絕對置中 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 點擊空白處重置用的隱形層 (放在最底層) */
        .canvas-bg-clickable {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        /* 核心修復：這是一個鎖死 16:9 的萬能容器 */
        .ratio-container {
            position: relative;
            aspect-ratio: 16 / 9;
            /* 寬度盡量撐滿，高度不超過畫布，保持比例 */
            width: 100%;
            max-height: 100%;
            z-index: 2;
            pointer-events: none;
            /* 讓點擊穿透到空白背景 */
        }

        /* 如果螢幕超寬，則高度撐滿，寬度自動縮小以保持 16:9 */
        @media (min-aspect-ratio: 16/9) {
            .ratio-container {
                width: auto;
                height: 100%;
            }
        }

        .base-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* 因為容器已經是 16:9，圖片會完美貼合不會留白 */
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            mix-blend-mode: multiply;
            filter: contrast(1.05);
            pointer-events: none;
        }

        .active-img {
            opacity: 1;
            z-index: 2;
        }

        .hotspots-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            /* 避免遮擋背景點擊 */
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            border-radius: 40%;
            /* border: 2px dashed rgba(255,0,0,0.5); /* 開發測試時可開啟此行 */
            z-index: 10;
            pointer-events: auto;
            /* 啟用熱區專屬的點擊感應 */
        }

        /* ================= 熱區精準定位 ================= */

        /* 人形圖 (16:9 比例) */
        .hotspot-head {
            top: 12%;
            left: 42%;
            width: 16%;
            height: 23%;
        }

        .hotspot-chest {
            top: 38%;
            left: 43%;
            width: 14%;
            height: 18%;
        }

        .hotspot-abdomen {
            top: 56%;
            left: 43%;
            width: 14%;
            height: 16%;
        }

        .hotspot-body {
            top: 75%;
            left: 43%;
            width: 14%;
            height: 20%;
        }

        /* 醫院圖 (16:9 比例) */
        .hotspot-opd {
            top: 40%;
            left: 7%;
            width: 22%;
            height: 35%;
            border-radius: 10px;
        }

        .hotspot-er {
            top: 70%;
            left: 36%;
            width: 20%;
            height: 20%;
            border-radius: 10px;
        }

        .hotspot-or {
            top: 15%;
            left: 48%;
            width: 22%;
            height: 25%;
            border-radius: 10px;
        }

        .hotspot-pharmacy {
            top: 70%;
            left: 27%;
            width: 8%;
            height: 8%;
            border-radius: 10px;
        }

        .hotspot-physio {
            top: 48%;
            left: 48%;
            width: 22%;
            height: 22%;
            border-radius: 10px;
        }

        .hotspot-hospice {
            top: 15%;
            left: 8%;
            width: 22%;
            height: 20%;
            border-radius: 10px;
        }

        .hotspot-cancer {
            top: 15%;
            left: 31%;
            width: 15%;
            height: 18%;
            border-radius: 10px;
        }

        /* 行政庶務圖 (16:9 比例) */
        .hotspot-admin {
            top: 45%;
            left: 30%;
            width: 18%;
            height: 25%;
            border-radius: 10px;
        }

        .hotspot-env {
            top: 45%;
            left: 52%;
            width: 18%;
            height: 25%;
            border-radius: 10px;
        }

        /* ================= 彈出選單設定 ================= */
        .protocols-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .protocol-btn {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.96);
            border: 2px solid #3498db;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .protocol-btn.show,
        .protocol-btn.locked {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .protocol-btn:hover {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            border-color: #e74c3c;
            z-index: 25;
        }

        /* 視覺引導線 */
        .protocol-btn::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #e74c3c;
            border-radius: 50%;
            box-shadow: 0 0 8px #e74c3c;
            z-index: -1;
        }

        .pos-head::before {
            top: 50%;
            left: -20px;
            transform: translateY(-50%);
        }

        .pos-chest::before {
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
        }

        .pos-abdomen::before {
            top: 50%;
            left: -20px;
            transform: translateY(-50%);
        }

        .pos-body::before {
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
        }

        .protocol-title {
            font-size: var(--title-font-size);
            color: #2980b9;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 5px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .protocol-item {
            font-size: var(--menu-font-size);
            color: #555;
            display: block;
            padding: 8px 10px;
            background: #f8f9fa;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            border-left: 3px solid transparent;
        }

        .protocol-item:hover,
        .protocol-item:active {
            background: #ffeaa7;
            color: #d35400;
            border-left: 3px solid #d35400;
        }

        /* --- 電腦版選單位置 --- */
        .pos-head {
            top: 15%;
            left: calc(50% + 140px);
        }

        .pos-chest {
            top: 35%;
            right: calc(50% + 140px);
            left: auto;
        }

        .pos-abdomen {
            top: 55%;
            left: calc(50% + 140px);
        }

        /* 核心修復：將全身性選單往上移，避免超出底部界線 */
        .pos-body {
            top: 40%;
            right: calc(50% + 140px);
            left: auto;
        }

        .pos-opd {
            top: 40%;
            left: 30%;
        }

        .pos-er {
            top: 60%;
            left: 57%;
        }

        .pos-or {
            top: 15%;
            left: 72%;
        }

        .pos-pharmacy {
            top: 70%;
            left: 10%;
        }

        .pos-physio {
            top: 65%;
            left: 72%;
        }

        .pos-hospice {
            top: 20%;
            left: 31%;
        }

        .pos-cancer {
            top: 15%;
            left: 48%;
        }

        .hosp-btn {
            border-color: #e67e22;
        }

        .hosp-title {
            color: #d35400;
        }

        .hosp-btn::before {
            display: none;
        }

        .pos-admin {
            top: 30%;
            left: 48%;
            width: 250px;
        }

        .pos-env {
            top: 30%;
            left: 25%;
            width: 250px;
        }

        .desk-btn {
            border-color: #27ae60;
        }

        .desk-title {
            color: #1e8449;
        }

        .desk-btn::before {
            display: none;
        }

        /* ================= 手機/平板版 RWD ================= */
        @media (max-width: 768px) {
            body {
                padding: 0;
                background-color: white;
            }

            .app-container {
                border-radius: 0;
                box-shadow: none;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .header,
            .tabs {
                flex-shrink: 0;
            }

            .header {
                padding: 15px 10px;
            }

            .content-area {
                height: 0;
                flex: 1;
                display: flex !important;
                flex-direction: column;
                padding: 0;
                background-color: #f4f6f9;
                overflow-y: auto;
            }

            .content-area:not(.active) {
                display: none !important;
            }

            .visual-canvas {
                border-radius: 0;
                box-shadow: none;
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: 100%;
                overflow: visible;
                background-color: white;
                justify-content: flex-start;
            }

            /* 手機版圖片區塊 Sticky：由於是橫圖，我們讓它的寬度自然撐滿 */
            .ratio-container {
                position: sticky;
                top: 0;
                width: 100%;
                height: auto;
                aspect-ratio: 16 / 9;
                background: white;
                z-index: 10;
                border-bottom: 1px solid #ddd;
                flex-shrink: 0;
            }

            .canvas-bg-clickable {
                display: none;
            }

            /* 下方選單列表 */
            .protocols-container {
                position: relative;
                display: flex;
                flex-direction: column;
                pointer-events: auto;
                padding: 15px;
                padding-bottom: 60px;
            }

            .protocol-btn {
                position: relative !important;
                display: none !important;
                width: 100% !important;
                max-width: 100% !important;
                top: auto !important;
                left: auto !important;
                right: auto !important;
                opacity: 1 !important;
                transform: none !important;
                margin-bottom: 10px;
                border-radius: 8px;
                border-width: 1px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            }

            .protocol-btn::before {
                display: none;
            }

            .protocol-btn.locked {
                display: flex !important;
            }

            .protocol-title {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .protocol-item {
                border: 1px solid #eee;
                border-left: 4px solid #3498db;
                margin-bottom: 6px;
            }

            .hosp-btn .protocol-item {
                border-left-color: #e67e22;
            }

            .desk-btn .protocol-item {
                border-left-color: #27ae60;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="header">
            <h2>護理作業規範互動導覽系統</h2>
            <p>點選圖形區域顯示規範選單，點擊空白處恢復初始狀態</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab1', this)">🧍 人形圖</button>
            <button class="tab-btn" onclick="switchTab('tab2', this)">🏥 醫院圖</button>
            <button class="tab-btn" onclick="switchTab('tab3', this)">🖥️ 行政庶務圖</button>
        </div>

        <!-- ================= 頁籤一：人形圖 ================= -->
        <!-- 圖片 / 熱區 / 選單內容已改為由 TAB_DATA 資料表於 renderTab() 動態產生，
             不再手動維護重複的 HTML；如需新增/修改規範，只需編輯下方 <script> 內的 TAB1_DATA -->
        <div id="tab1" class="content-area active">
            <div class="visual-canvas" id="canvas-tab1">
                <div class="canvas-bg-clickable" onclick="resetCanvas('tab1')"></div>

                <!-- 統一使用 16:9 的比例容器 -->
                <div class="ratio-container" id="ratio-tab1">
                    <!-- 底圖與所有亮起圖：由 renderTab() 動態插入 -->
                    <div class="hotspots-overlay" id="hotspots-tab1">
                        <!-- 熱區：由 renderTab() 動態插入 -->
                    </div>
                </div>

                <div class="protocols-container" id="menus-tab1">
                    <!-- 選單：由 renderTab() 動態插入 -->
                </div>
            </div>
        </div>

        <!-- ================= 頁籤二：醫院圖 ================= -->
        <!-- 內容由 TAB2_DATA 資料表動態產生，見下方的 JS 區塊 -->
        <div id="tab2" class="content-area">
            <div class="visual-canvas" id="canvas-tab2">
                <div class="canvas-bg-clickable" onclick="resetCanvas('tab2')"></div>
                <div class="ratio-container" id="ratio-tab2">
                    <div class="hotspots-overlay" id="hotspots-tab2"></div>
                </div>

                <div class="protocols-container" id="menus-tab2"></div>
            </div>
        </div>

        <!-- ================= 頁籤三：行政庶務圖 ================= -->
        <!-- 內容由 TAB3_DATA 資料表動態產生，見下方的 JS 區塊 -->
        <div id="tab3" class="content-area">
            <div class="visual-canvas" id="canvas-tab3">
                <div class="canvas-bg-clickable" onclick="resetCanvas('tab3')"></div>
                <div class="ratio-container" id="ratio-tab3">
                    <div class="hotspots-overlay" id="hotspots-tab3"></div>
                </div>

                <div class="protocols-container" id="menus-tab3"></div>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
           資料驅動設定 (Data-Driven Config)
           ------------------------------------------------------------
           新增 / 修改 / 刪除規範連結，只需要編輯下方 TAB1_DATA / TAB2_DATA /
           TAB3_DATA 三個物件即可，不需要再手動同步 HTML 中的圖片、熱區、選單。
           每個 region 會依 id 自動對應既有 CSS 類別：
             .hotspot-{regionId}  (熱區座標，定義在 <style> 區)
             .pos-{regionId}      (選單彈出位置，定義在 <style> 區)
           若新增全新的 region，記得在 <style> 補上對應的
           .hotspot-xxx / .pos-xxx 座標即可。
           ============================================================ */

        const TAB1_DATA = {
            id: 'tab1',
            baseImage: { id: 'base-human', src: './body.png', alt: '人體正面示意圖' },
            images: [
                { id: 'img-nervous', src: './Nervous_system.png', alt: '神經系統示意圖' },
                { id: 'img-circulatory', src: './Circulatory_System.png', alt: '心臟血管系統示意圖' },
                { id: 'img-respiratory', src: './Respiratory_system.png', alt: '呼吸系統示意圖' },
                { id: 'img-digestive', src: './digestive_system.png', alt: '消化系統示意圖' },
                { id: 'img-urinary', src: './Urinary_system.png', alt: '泌尿系統示意圖' },
                { id: 'img-vital', src: './vital_sing.png', alt: '生命徵象示意圖' },
                { id: 'img-fluid', src: './Fluid_supply.png', alt: '體液供給示意圖' },
                { id: 'img-comfort', src: './Comfort_needs.png', alt: '舒適需要示意圖' },
                { id: 'img-wound', src: './wound_care.png', alt: '傷口照護示意圖' }
            ],
            regions: [
                {
                    id: 'head', image: 'img-nervous', title: '🧠 頭部 (神經系統)', badge: null,
                    items: [
                        { no: '015', name: '神經感覺系統', url: 'https://drive.google.com/drive/folders/12VOsJeTQ-9hwwenurnduTRP0vrgo_xx7?usp=drive_link' }
                    ]
                },
                {
                    id: 'chest', image: 'img-circulatory', title: '🫁 胸部 (心肺系統)', badge: null,
                    items: [
                        { no: '013', name: '心臟血管系統護理', url: 'https://drive.google.com/drive/folders/1E37ZeXwyxT4jpMZoeNtkM1Fh1fgbKSwz?usp=drive_link', hoverImage: 'img-circulatory' },
                        { no: '014', name: '呼吸系統', url: 'https://drive.google.com/drive/folders/1JJtMeUILg1M1nRFslp1-cR5Dv0qutPmY?usp=drive_link', hoverImage: 'img-respiratory' }
                    ]
                },
                {
                    id: 'abdomen', image: 'img-digestive', title: '🩺 腹部 (消化與泌尿)', badge: null,
                    items: [
                        { no: '012', name: '消化道系統護理', url: 'https://drive.google.com/drive/folders/1NfBIMXB8LZme0O1S5afTLTAZEEm5T7h7?usp=drive_link', hoverImage: 'img-digestive' },
                        { no: '016', name: '腎臟泌尿系統', url: 'https://drive.google.com/drive/folders/1VIhzRwqwzf36dcTHrkgJAo6LJIuUDhke?usp=drive_link', hoverImage: 'img-urinary' }
                    ]
                },
                {
                    id: 'body', image: 'img-vital', title: '🩸 全身性 (體徵與皮膚)', badge: null,
                    items: [
                        { no: '001', name: '生命徵象.疼痛.情緒困擾', url: 'https://drive.google.com/drive/folders/1omd_6gZsQcPwunujpwxd84qgLnrx8e92?usp=drive_link', hoverImage: 'img-vital' },
                        { no: '002', name: '體液供給', url: 'https://drive.google.com/drive/folders/1vSrsuosLLVV4ocY4h2b1eDl8C6BwYxB7?usp=drive_link', hoverImage: 'img-fluid' },
                        { no: '011', name: '舒適需要', url: 'https://drive.google.com/drive/folders/1ODrOuVaCIt0mE9BH7CGAmJtQ0pQFqk9T?usp=drive_link', hoverImage: 'img-comfort' },
                        { no: '020', name: '傷口照護', url: 'https://drive.google.com/drive/folders/1FQqTWZunZp0pbhMKfx-yrLtiZ0W5PZnR?usp=drive_link', hoverImage: 'img-wound' }
                    ]
                }
            ]
        };

        const TAB2_DATA = {
            id: 'tab2',
            baseImage: { id: 'base-hospital', src: './hostipal.png', alt: '醫院平面示意圖' },
            images: [
                { id: 'img-opd', src: './OPD.png', alt: '門診區域示意圖' },
                { id: 'img-er', src: './ER.png', alt: '急診區域示意圖' },
                { id: 'img-or', src: './OR.png', alt: '手術區域示意圖' },
                { id: 'img-pharmacy', src: './Pharmacy.png', alt: '藥局示意圖' },
                { id: 'img-physio', src: './RD-NM-Physio.png', alt: '放射生理檢驗核醫示意圖' },
                { id: 'img-cancer', src: './Cancer_Care.png', alt: '癌症照護示意圖' },
                { id: 'img-hospice', src: './Hospice_care.png', alt: '安寧療護示意圖' }
            ],
            regions: [
                {
                    id: 'opd', image: 'img-opd', title: '🟦 門診區域 (OPD)', badge: 'hosp',
                    items: [{ no: '003', name: '醫囑.會診', url: 'https://drive.google.com/drive/folders/1YxIvPCKZmObEV49wHzL1Ig_CMtxIUEkt?usp=drive_link' }]
                },
                {
                    id: 'er', image: 'img-er', title: '🟧 急診區域 (ER)', badge: 'hosp',
                    items: [{ no: '006', name: '緊急救護', url: 'https://drive.google.com/drive/folders/1VM4nAxDPZ6TukzIlfTTFqtcBzwoczTDz?usp=drive_link' }]
                },
                {
                    id: 'or', image: 'img-or', title: '🟥 手術區域 (OR)', badge: 'hosp',
                    items: [{ no: '004', name: '手術護理', url: 'https://drive.google.com/drive/folders/1dRixMwUWKFF8ra9BO0UMXQF4ctlwPu5P?usp=drive_link' }]
                },
                {
                    id: 'pharmacy', image: 'img-pharmacy', title: '🟩 藥物安全 (藥局)', badge: 'hosp',
                    items: [{ no: '010', name: '藥物安全', url: 'https://drive.google.com/drive/folders/1JEUwKq4fzA9j4O-WjchVhgdWmDpIZ5k4?usp=drive_link' }]
                },
                {
                    id: 'physio', image: 'img-physio', title: '🟪 放射/生理/檢驗/核醫', badge: 'hosp',
                    items: [{ no: '019', name: '放射、生理、檢驗、核醫', url: 'https://drive.google.com/drive/folders/1vGjMz_JR3A7bEJkKX4u8QKQ-xA6hwRii?usp=drive_link' }]
                },
                {
                    id: 'hospice', image: 'img-hospice', title: '🌸 安寧療護', badge: 'hosp',
                    items: [{ no: '018', name: '安寧療護及臨終護理', url: 'https://drive.google.com/drive/folders/1cp0v1T-RggkdamHnsSw658JSivPHyZsm?usp=drive_link' }]
                },
                {
                    id: 'cancer', image: 'img-cancer', title: '🟨 癌症照護', badge: 'hosp',
                    items: [{ no: '017', name: '癌症照護', url: 'https://drive.google.com/drive/folders/1Wj3exP9S_cUY1dGlbkhSyB5qXhOq2ZRH?usp=drive_link' }]
                }
            ]
        };

        const TAB3_DATA = {
            id: 'tab3',
            baseImage: { id: 'base-desktop', src: './desktop.png', alt: '辦公桌面示意圖' },
            images: [
                { id: 'img-admin', src: './Nursing_Administration.png', alt: '護理行政示意圖' },
                { id: 'img-env', src: './Environment_Infection_Control.png', alt: '環境感染控制示意圖' }
            ],
            regions: [
                {
                    id: 'admin', image: 'img-admin', title: '📋 護理行政與交班', badge: 'desk',
                    items: [
                        { no: '005', name: '出入院管理', url: 'https://drive.google.com/drive/folders/1McWp-B02Lmik20HePdzV_CBaKSFVFMBO?usp=drive_link' },
                        { no: '021', name: '護理交班及其他庶務', url: 'https://drive.google.com/drive/folders/1AhJtnIKIGepHrB7NvqTdgOyxgtj1deas?usp=drive_link' }
                    ]
                },
                {
                    id: 'env', image: 'img-env', title: '🛡️ 環境與感染控制', badge: 'desk',
                    items: [
                        { no: '007', name: '權益維護', url: 'https://drive.google.com/drive/folders/1BZI7cb09tgDLejy4EHjfnsvH8CKm2qF5?usp=drive_link' },
                        { no: '008', name: '醫療環境', url: 'https://drive.google.com/drive/folders/1IpkVTM-uRCQLxoX4P_nl07W9dttU1F6Y?usp=drive_link' },
                        { no: '009', name: '感染管制委員會', url: 'https://drive.google.com/drive/folders/1ULWwyTdcmb0rW9Nvy-LqC1XcX-_WNcmc?usp=drive_link' }
                    ]
                }
            ]
        };

        /* ============================================================
           圖片載入失敗 fallback：改用內嵌 SVG 佔位圖取代 <img>，
           讓既有的淡入淡出 / mix-blend-mode 效果不需額外處理即可沿用。
           ============================================================ */
        const IMG_FALLBACK_SRC = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">' +
            '<rect width="800" height="450" fill="#f1f3f5"/>' +
            '<text x="400" y="210" font-size="26" text-anchor="middle" fill="#adb5bd" font-family="Microsoft JhengHei, sans-serif">⚠ 圖片載入失敗</text>' +
            '<text x="400" y="248" font-size="15" text-anchor="middle" fill="#ced4da" font-family="Microsoft JhengHei, sans-serif">請確認圖片檔案是否存在</text>' +
            '</svg>'
        );

        function handleImageError(imgEl) {
            if (imgEl.dataset.fallbackApplied) return; // 避免 SVG 佔位圖也觸發 onerror 造成無窮迴圈
            imgEl.dataset.fallbackApplied = 'true';
            console.warn('[圖片載入失敗]', imgEl.id, imgEl.getAttribute('data-original-src') || imgEl.src);
            imgEl.src = IMG_FALLBACK_SRC;
        }

        /* ============================================================
           依 TAB_DATA 動態產生 圖片 / 熱區 / 選單
           - 圖片統一加上 loading="lazy"：未啟用的頁籤（display:none）
             瀏覽器會延後下載其圖片，改善初次載入效能。
           - 圖片統一加上 onerror fallback，避免破圖。
           ============================================================ */
        function renderTab(data) {
            const ratioContainer = document.getElementById(`ratio-${data.id}`);
            const hotspotsContainer = document.getElementById(`hotspots-${data.id}`);
            const menusContainer = document.getElementById(`menus-${data.id}`);

            // 1. 圖片（底圖 + 各系統/區域圖），插入在 hotspots-overlay 之前
            const allImages = [data.baseImage, ...data.images];
            const imagesHtml = allImages.map((img, idx) => `
                <img id="${img.id}" src="${img.src}" data-original-src="${img.src}"
                     class="base-image${idx === 0 ? ' active-img' : ''}"
                     loading="lazy" alt="${img.alt || ''}"
                     onerror="handleImageError(this)">
            `).join('');
            hotspotsContainer.insertAdjacentHTML('beforebegin', imagesHtml);

            // 2. 熱區
            hotspotsContainer.innerHTML = data.regions.map(region => `
                <div class="hotspot hotspot-${region.id}"
                     onmouseenter="hoverRegion('${data.id}', '${region.id}', '${region.image}')"
                     onmouseleave="leaveHoverRegion('${data.id}')"
                     onclick="lockRegion('${data.id}', '${region.id}', '${region.image}')"></div>
            `).join('');

            // 3. 選單
            menusContainer.innerHTML = data.regions.map(region => {
                const badgeBtnClass = region.badge ? `${region.badge}-btn` : '';
                const badgeTitleClass = region.badge ? `${region.badge}-title` : '';
                const itemsHtml = region.items.map(item => {
                    const hoverAttrs = item.hoverImage
                        ? `onmouseenter="hoverItem('${data.id}', '${item.hoverImage}')" onmouseleave="restoreRegionImage('${data.id}')" ontouchstart="hoverItem('${data.id}', '${item.hoverImage}')"`
                        : '';
                    return `<a class="protocol-item ext-link" ${hoverAttrs} href="${item.url}" target="_blank">${item.no} ${item.name}</a>`;
                }).join('');
                return `
                <div id="menu-${data.id}-${region.id}" class="protocol-btn ${badgeBtnClass} pos-${region.id}"
                     onmouseenter="enterMenu('${data.id}')" onmouseleave="leaveMenu('${data.id}')">
                    <div class="protocol-title ${badgeTitleClass}">${region.title}</div>
                    ${itemsHtml}
                </div>`;
            }).join('');
        }

        const state = {
            tab1: { isLocked: false, lockedRegion: null, lockedImageId: null, hoveredImageId: null, baseImageId: 'base-human' },
            tab2: { isLocked: false, lockedRegion: null, lockedImageId: null, hoveredImageId: null, baseImageId: 'base-hospital' },
            tab3: { isLocked: false, lockedRegion: null, lockedImageId: null, hoveredImageId: null, baseImageId: 'base-desktop' }
        };

        let hoverTimer;
        const isMobile = () => window.innerWidth <= 768;

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.content-area').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
            if (state[tabId]) resetCanvas(tabId);
        }

        function hoverRegion(tabId, regionId, imageId) {
            if (state[tabId].isLocked || isMobile()) return;
            clearTimeout(hoverTimer);
            hideAllMenus(tabId);

            state[tabId].hoveredImageId = imageId;

            document.querySelectorAll(`#${tabId} .base-image`).forEach(img => img.classList.remove('active-img'));
            if (imageId) document.getElementById(imageId)?.classList.add('active-img');

            const menu = document.getElementById(`menu-${tabId}-${regionId}`);
            if (menu) menu.classList.add('show');
        }

        function leaveHoverRegion(tabId) {
            if (state[tabId].isLocked || isMobile()) return;
            hoverTimer = setTimeout(() => {
                hideAllMenus(tabId);
                state[tabId].hoveredImageId = null;
                document.getElementById(state[tabId].baseImageId)?.classList.add('active-img');
            }, 150);
        }

        function enterMenu(tabId) {
            if (state[tabId].isLocked || isMobile()) return;
            clearTimeout(hoverTimer);
        }

        function leaveMenu(tabId) {
            if (isMobile()) return;
            if (state[tabId].isLocked) {
                restoreRegionImage(tabId);
                return;
            }
            leaveHoverRegion(tabId);
        }

        function lockRegion(tabId, regionId, imageId) {
            if (state[tabId].lockedRegion === regionId) {
                resetCanvas(tabId);
                return;
            }

            document.querySelectorAll(`#${tabId} .protocol-btn`).forEach(menu => {
                menu.classList.remove('show');
                menu.classList.remove('locked');
            });

            state[tabId].isLocked = true;
            state[tabId].lockedRegion = regionId;
            state[tabId].lockedImageId = imageId;

            document.querySelectorAll(`#${tabId} .base-image`).forEach(img => img.classList.remove('active-img'));
            if (imageId) document.getElementById(imageId)?.classList.add('active-img');

            const menu = document.getElementById(`menu-${tabId}-${regionId}`);
            if (menu) menu.classList.add('locked');
        }

        function resetCanvas(tabId) {
            state[tabId].isLocked = false;
            state[tabId].lockedRegion = null;
            state[tabId].lockedImageId = null;
            state[tabId].hoveredImageId = null;
            hideAllMenus(tabId);
            document.querySelectorAll(`#${tabId} .protocol-btn`).forEach(menu => menu.classList.remove('locked'));
            document.getElementById(state[tabId].baseImageId)?.classList.add('active-img');
        }

        function hoverItem(tabId, imageId) {
            if (isMobile()) return;
            document.querySelectorAll(`#${tabId} .base-image`).forEach(img => img.classList.remove('active-img'));
            if (imageId) document.getElementById(imageId)?.classList.add('active-img');
        }

        function restoreRegionImage(tabId) {
            if (isMobile()) return;
            document.querySelectorAll(`#${tabId} .base-image`).forEach(img => img.classList.remove('active-img'));

            if (state[tabId].isLocked) {
                if (state[tabId].lockedImageId) {
                    document.getElementById(state[tabId].lockedImageId)?.classList.add('active-img');
                } else {
                    document.getElementById(state[tabId].baseImageId)?.classList.add('active-img');
                }
            } else if (state[tabId].hoveredImageId) {
                document.getElementById(state[tabId].hoveredImageId)?.classList.add('active-img');
            } else {
                document.getElementById(state[tabId].baseImageId)?.classList.add('active-img');
            }
        }

        function hideAllMenus(tabId) {
            document.querySelectorAll(`#${tabId} .base-image`).forEach(img => img.classList.remove('active-img'));
            document.querySelectorAll(`#${tabId} .protocol-btn`).forEach(menu => {
                if (!menu.classList.contains('locked')) {
                    menu.classList.remove('show');
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            // 依資料表產生三個頁籤的圖片 / 熱區 / 選單
            renderTab(TAB1_DATA);
            renderTab(TAB2_DATA);
            renderTab(TAB3_DATA);

            // 外部連結改用事件代理 (event delegation)：
            // 因為 a.ext-link 現在是由 renderTab() 動態產生，
            // DOMContentLoaded 當下尚未存在，改用 document 層級監聽即可涵蓋所有動態內容。
            document.addEventListener('click', function (e) {
                const link = e.target.closest('a.ext-link');
                if (!link) return;
                const url = link.href;
                if (!url.includes('openExternalBrowser=1') && url !== '#' && !url.startsWith('javascript')) {
                    e.preventDefault();
                    const separator = url.includes('?') ? '&' : '?';
                    const newUrl = url + separator + 'openExternalBrowser=1';
                    window.open(newUrl, '_blank');
                }
            });
        });
    </script>
</body>
